<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rilldex · Source record</title><link rel="stylesheet" href="/workspace.css"><link rel="icon" type="image/svg+xml" href="/rilldex-mark.svg"><meta name="theme-color" content="#19212f"><meta name="description" content="Rilldex — RL Behavior Inspector. Monitor training, explore behavior maps and inspect rollout evidence."></head>
<body class="workspace source-page"><header class="workspace-bar"><div><a class="breadcrumb" href="/runs">Rollouts /</a><strong>Source record</strong></div><div class="bar-actions"><a id="source-map" href="/runs">Open behavior map</a></div></header>
<main><div class="page-head"><div><h1 id="source-title">Source record</h1><p id="source-description">Select a rollout to inspect its recorded events.</p></div><button id="source-export" disabled>Export record</button></div><p id="source-error" role="alert" hidden></p>
<div class="source-controls"><label>Rollout<select id="source-run"><option value="">Loading rollouts…</option></select></label><label>Find in source<input id="source-search" type="search" placeholder="Search event text, tool or ID"></label><label>Event type<select id="source-kind"><option value="">All event types</option></select></label></div>
<details class="source-metadata"><summary>Recorded context</summary><dl id="source-metadata"></dl></details><div class="section-heading"><h2>Recorded events</h2><span id="source-count" role="status">Loading…</span></div>
<div class="source-workbench"><div><div id="source-events" class="source-events" role="list" aria-label="Recorded events"></div><div class="pager"><button id="source-previous" disabled>Previous events</button><span id="source-page-number"></span><button id="source-next" disabled>Next events</button></div></div><section id="source-detail" class="source-detail" aria-label="Event details"><h2>Select an event</h2><p>Read its full text, source pointer and recorded fields here.</p></section></div>
</main><script src="/choice-labels.js"></script><script src="/workspace-navigation.js"></script><script src="/workspace.js"></script><script src="/app.js"></script></body></html>
