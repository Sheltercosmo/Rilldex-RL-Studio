<text x="193" y="55" font-size="15" fill="#65748a" font-weight="400" >/  BEHAVIOR</text><text x="1396" y="55" font-size="14" fill="#65748a" font-weight="600" text-anchor="end" letter-spacing="1.4">SIMULATED DEMO</text><text x="44" y="116" font-size="38" fill="#172339" font-weight="650" >Compare attempts and their follow-up</text><text x="46" y="153" font-size="20" fill="#65748a" font-weight="400" >Inspect how recorded approaches and later responses differ across two saved windows.</text><rect x="44" y="184" width="1352" height="60" rx="14" fill="#fff" stroke="#e3e8f1" /><text x="68" y="221" font-size="20" fill="#172339" font-weight="650" >Procedure changes</text><text x="371" y="221" font-size="18" fill="#65748a" font-weight="400" >Same task &amp; configuration</text><text x="828" y="221" font-size="18" fill="#65748a" font-weight="400" >Equal rollout weight</text><text x="1370" y="221" font-size="18" fill="#355cdb" font-weight="650" text-anchor="end">Save latest comparison</text><rect x="44" y="266" width="1002" height="555" rx="18" fill="#fff" stroke="#e3e8f1" /><text x="70" y="305" font-size="24" fill="#172339" font-weight="650" >What followed an earlier error?</text><rect x="72" y="329" width="12" height="12" rx="3" fill="#ce653b" stroke="none" /><text x="94" y="341" font-size="17" fill="#65748a" font-weight="400" >Error reported again</text><rect x="362" y="329" width="12" height="12" rx="3" fill="#008d7b" stroke="none" /><text x="384" y="341" font-size="17" fill="#65748a" font-weight="400" >No error reported</text><rect x="652" y="329" width="12" height="12" rx="3" fill="#a5afc1" stroke="none" /><text x="674" y="341" font-size="17" fill="#65748a" font-weight="400" >Unresolved</text><text x="366" y="390" font-size="18" fill="#172339" font-weight="600" >Earlier · steps 0–2</text><text x="698" y="390" font-size="18" fill="#172339" font-weight="600" >Later · steps 3–5</text><text x="70" y="445" font-size="18" fill="#172339" font-weight="600" >Same procedure</text><rect x="366" y="422" width="286" height="27" rx="0" fill="#ce653b" stroke="none" /><text x="366" y="472" font-size="15" fill="#65748a" font-weight="400" >4 eligible pairs · 1 rollout</text><rect x="698" y="422" width="286" height="27" rx="0" fill="#008d7b" stroke="none" /><text x="698" y="472" font-size="15" fill="#65748a" font-weight="400" >1 eligible pair · 1 rollout</text><text x="70" y="530" font-size="18" fill="#172339" font-weight="600" >Changed settings / inputs</text><rect x="366" y="507" width="143" height="27" rx="0" fill="#ce653b" stroke="none" /><rect x="509" y="507" width="143" height="27" rx="0" fill="#a5afc1" stroke="none" /><text x="366" y="557" font-size="15" fill="#65748a" font-weight="400" >2 eligible pairs · 1 rollout</text><rect x="698" y="507" width="143" height="27" rx="0" fill="#008d7b" stroke="none" /><rect x="841" y="507" width="143" height="27" rx="0" fill="#a5afc1" stroke="none" /><text x="698" y="557" font-size="15" fill="#65748a" font-weight="400" >2 eligible pairs · 1 rollout</text><text x="70" y="615" font-size="18" fill="#172339" font-weight="600" >Different procedure</text><rect x="366" y="592" width="286" height="27" rx="0" fill="#ce653b" stroke="none" /><text x="366" y="642" font-size="15" fill="#65748a" font-weight="400" >1 eligible pair · 1 rollout</text><rect x="698" y="592" width="286" height="27" rx="0" fill="#008d7b" stroke="none" /><text x="698" y="642" font-size="15" fill="#65748a" font-weight="400" >1 eligible pair · 1 rollout</text><text x="70" y="700" font-size="18" fill="#172339" font-weight="600" >Procedure unknown</text><rect x="366" y="677" width="286" height="27" rx="4" fill="#f1f4f8" stroke="none" /><text x="366" y="727" font-size="15" fill="#65748a" font-weight="400" >No eligible pairs</text><rect x="698" y="677" width="286" height="27" rx="0" fill="#a5afc1" stroke="none" /><text x="698" y="727" font-size="15" fill="#65748a" font-weight="400" >1 eligible pair · 1 rollout</text><text x="70" y="800" font-size="16" fill="#65748a" font-weight="400" >Within each approach · unresolved follow-up remains in the denominator</text><rect x="1066" y="266" width="330" height="555" rx="18" fill="#fff" stroke="#e3e8f1" /><text x="1090" y="305" font-size="13" fill="#65748a" font-weight="650" letter-spacing="1.2">MEASUREMENT CONTEXT</text><text x="1090" y="359" font-size="35" fill="#172339" font-weight="650" >7 / 7</text><text x="1090" y="390" font-size="16" fill="#65748a" font-weight="400" >Rollouts with saved observations</text><path d="M1090 415L1372 415" fill="none" stroke="#e3e8f1" stroke-width="1" /><text x="1090" y="453" font-size="31" fill="#172339" font-weight="650" >7 → 5</text><text x="1090" y="485" font-size="16" fill="#65748a" font-weight="400" >Pairs following an earlier error</text><text x="1090" y="531" font-size="20" fill="#172339" font-weight="600" >2 later pairs excluded</text><text x="1090" y="559" font-size="16" fill="#65748a" font-weight="400" >No earlier error was reported.</text><path d="M1090 589L1372 589" fill="none" stroke="#e3e8f1" stroke-width="1" /><text x="1090" y="625" font-size="19" fill="#355cdb" font-weight="650" >Inspect matching pairs →</text><text x="1090" y="657" font-size="16" fill="#65748a" font-weight="400" >Open the earlier action, change</text><text x="1090" y="682" font-size="16" fill="#65748a" font-weight="400" >and subsequent response.</text><text x="1090" y="733" font-size="16" fill="#65748a" font-weight="400" >No error reported does not</text><text x="1090" y="758" font-size="16" fill="#65748a" font-weight="400" >establish successful recovery.</text><text x="68" y="863" font-size="20" fill="#172339" font-weight="650" >Save latest comparison</text><text x="414" y="863" font-size="20" fill="#172339" font-weight="650" >Capture latest evidence</text><text x="866" y="863" font-size="20" fill="#172339" font-weight="650" >Keep both for review</text><text x="68" y="892" font-size="16" fill="#65748a" font-weight="400" >Fixed membership and observations</text><text x="414" y="892" font-size="16" fill="#65748a" font-weight="400" >Refresh the same windows explicitly</text><text x="866" y="892" font-size="16" fill="#65748a" font-weight="400" >Return to the exact supporting pairs</text><text x="44" y="925" font-size="15" fill="#65748a" font-weight="400" >Authored behavior examples · aggregated by the product pipeline · no model calls or measured accuracy claim</text><text x="1396" y="925" font-size="12" fill="#65748a" font-weight="600" text-anchor="end" letter-spacing="1.5">RILLDEX RL STUDIO</text></g></svg>